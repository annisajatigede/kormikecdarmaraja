<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f87171" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
  </defs>
  <!-- Background with subtle border -->
  <rect width="512" height="512" rx="110" fill="#0f172a" />
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="url(#grad)" stroke-width="8" stroke-opacity="0.6" />
  
  <!-- Outer Ring Accent -->
  <circle cx="256" cy="256" r="170" fill="none" stroke="url(#glow)" stroke-width="6" stroke-dasharray="16 12" opacity="0.4" />
  
  <!-- Inner Circle Base -->
  <circle cx="256" cy="256" r="140" fill="url(#grad)" opacity="0.15" />

  <!-- Stylized Figure of Fitness / Gymnastics / Senam -->
  <g transform="translate(0, -10)">
    <!-- Head -->
    <circle cx="256" cy="155" r="32" fill="#ffffff" />
    <!-- Heart / Torch Glow -->
    <circle cx="256" cy="155" r="38" fill="none" stroke="#fca5a5" stroke-width="4" opacity="0.8" />
    
    <!-- Dynamic Body / Dynamic Motion -->
    <path d="M 256 195 C 230 220 200 240 160 250 C 145 254 150 275 168 270 C 205 260 235 240 256 225 C 277 240 307 260 344 270 C 362 275 367 254 352 250 C 312 240 282 220 256 195 Z" fill="#ffffff" />
    
    <!-- Torso and Ribbon Wings -->
    <path d="M 244 225 Q 256 280 230 335 C 220 355 245 368 256 350 Q 275 315 268 225 Z" fill="#ffffff" />
    
    <!-- Energized Ribbons Left & Right -->
    <path d="M 200 245 C 160 290 170 340 215 350 C 200 365 150 345 145 285 C 140 245 175 225 200 245 Z" fill="url(#glow)" />
    <path d="M 312 245 C 352 290 342 340 297 350 C 312 365 362 345 367 285 C 372 245 337 225 312 245 Z" fill="url(#glow)" />
  </g>

  <!-- Typography: KORMI DARMARAJA -->
  <text x="256" y="420" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="4">KORMI</text>
  <text x="256" y="448" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700" fill="#38bdf8" text-anchor="middle" letter-spacing="3">DARMARAJA</text>
</svg>
